[project]
name = "mqtt-raspi"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
  "dotenv",
  "docker",
  "psutil",
  "pi5neo",
  "strip_ansi",
  "ha-mqtt-discoverable",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-aarch64"]

[tool.pixi.pypi-dependencies]
mqtt_raspi = { path = ".", editable = true }

[tool.pixi.tasks]
mqtt = 'python3 src/mqtt_raspi/mqtt.py'
dev_mqtt = 'npx nodemon --exec python3 src/mqtt_raspi/mqtt.py'
cli = 'python3 src/mqtt_raspi/cli.py'
